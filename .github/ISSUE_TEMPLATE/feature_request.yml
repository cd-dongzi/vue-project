name: Feature request
description: 建议适合本教学项目的新功能或改进
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述具体使用或学习场景，不要只描述实现方案。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明预期行为、替代方案和可能的兼容性影响。
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 实现范围
      description: 是否涉及新依赖、网络请求、数据存储或构建配置？
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索现有 Issue 和 Pull Request。
          required: true
        - label: 我愿意在维护者确认方案后提交 Pull Request。
          required: false
